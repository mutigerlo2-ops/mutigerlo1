<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="mutigerlo2 - Roblox scripter and builder. Previous work and contact.">
<meta property="og:title" content="mutigerlo2">
<meta property="og:description" content="Roblox scripter and builder.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22%3E%3Crect width=%228%22 height=%228%22 fill=%22%230b0909%22/%3E%3Crect x=%222%22 y=%222%22 width=%224%22 height=%224%22 fill=%22%23e2372c%22/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>mutigerlo2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
<style>
/* Layout: image-first. Name set big over the first screenshot, then the rest of the work, then contact as plain text. Single dark theme on purpose. */
:root{
  color-scheme:dark;
  --bg:#0b0909; --fg:#ece6df; --muted:#8a807a; --line:#262020; --red:#e2372c;
  --font:"Pixelify Sans","Courier New",monospace;
  --shadow:#3a3634;
}
/* Minecraft-style hard drop shadow on all text */
body,body *{text-shadow:.12em .12em 0 var(--shadow)}
.name h1{text-shadow:.07em .07em 0 var(--shadow)!important}
.links a,.links button{text-shadow:.08em .08em 0 var(--shadow)}
.caret{display:inline-block;width:.5em;height:.12em;background:var(--fg);margin-left:.05em;vertical-align:baseline;box-shadow:.07em .07em 0 var(--shadow);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--font);padding-inline:16px;padding-block:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;position:relative;z-index:1}

.top{display:flex;justify-content:space-between;align-items:center;padding-block:22px;font-size:15px}
.top b{font-weight:700;font-stretch:80%}
.top nav{display:flex;gap:24px;color:var(--muted)}
.top nav a:hover{color:var(--fg)}

/* hero */
.hero{position:relative;margin-top:8px}
.shot{margin:0;overflow:hidden;background:#000;cursor:pointer;border-radius:3px}
.shot img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),filter .6s}
.shot:hover img{transform:scale(1.035);filter:brightness(1.1)}
.hero .shot{aspect-ratio:1661/800}
.name{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:-0.42em;position:relative;font-size:clamp(2.6rem,10.5vw,9.5rem);pointer-events:none}
.name h1{margin:0;font:700 1em/.9 var(--font);letter-spacing:0;white-space:nowrap}
.name p{margin:0 0 .35em;font-size:17px;color:var(--muted);max-width:28ch}
.name p strong{color:var(--fg);font-weight:600}

/* work */
.work{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding-block:96px 120px}
.work .w{grid-column:span 12;aspect-ratio:1363/700}
.work .l{grid-column:span 7;aspect-ratio:1289/745}
.work .r{grid-column:span 5;aspect-ratio:auto}

/* contact */
.contact{border-top:1px solid var(--line);padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px}
.contact h2{margin:0;font:800 2rem/1 var(--font);font-stretch:70%}
.links{display:flex;flex-direction:column}
.links a,.links button{all:unset;display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);font:700 clamp(1.6rem,4.2vw,3.2rem)/1.1 var(--font);font-stretch:70%;cursor:pointer;overflow-wrap:anywhere;transition:color .3s,padding .4s cubic-bezier(.2,.8,.2,1)}
.links a:hover,.links button:hover{color:var(--red);padding-left:12px}
.links small{font:400 14px var(--font);color:var(--muted);white-space:nowrap}
footer{padding-block:28px 40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px}

/* motion */
.in{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}
@keyframes rise{from{transform:translateY(30px);opacity:.15}to{transform:none;opacity:1}}
.reveal{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.below{transform:translateY(50px)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(6,5,5,.95);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;cursor:pointer}
.lb.open{opacity:1;visibility:visible}
.lb img{max-width:100%;max-height:90vh;border-radius:3px;transform:scale(.95);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lb.open img{transform:none}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* cursor */
.cur{position:fixed;left:0;top:0;pointer-events:none;z-index:30;opacity:0;transition:opacity .3s}
.cur.dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--red)}
.cur.ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid rgba(236,230,223,.5);transition:opacity .3s,width .3s,height .3s,margin .3s,border-color .3s}
.cur.ring.big{width:70px;height:70px;margin:-35px 0 0 -35px;border-color:var(--red)}
@media (pointer:fine){html.has-cur,html.has-cur *{cursor:none!important}.cur.on{opacity:1}}

@media (max-width:760px){
  .work{padding-block:64px 80px}
  .work .l,.work .r{grid-column:span 12}
  .work .r{aspect-ratio:1109/870}
  .contact{grid-template-columns:minmax(0,1fr)}
  .name{margin-top:-.3em}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.in{animation:none}.reveal.below,.shot:hover img{transform:none}#fx{display:none}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <b>mutigerlo2</b>
    <nav aria-label="Sections"><a href="#work">work</a><a href="#contact">contact</a></nav>
  </header>

  <div class="hero">
    <figure class="shot in"><img src="images/3.webp" alt="Red-lit bunker room with a soldier NPC talking over the radio"></figure>
    <div class="name">
      <h1 class="in d1" id="type" aria-label="mutigerlo2"><span id="typed">mutigerlo2</span><span class="caret" aria-hidden="true"></span></h1>
      <p class="in d2"><strong>Scripter &amp; builder</strong> on Roblox.</p>
    </div>
  </div>

  <main class="work" id="work">
    <figure class="shot w reveal"><img src="images/1.webp" alt="First-person view down a brick corridor with steel trusses and a rifle with a laser sight" loading="lazy"></figure>
    <figure class="shot l reveal"><img src="images/2.webp" alt="Dark red corridor with a restricted-area sign and papers on the floor" loading="lazy"></figure>
    <figure class="shot r reveal"><img src="images/4.webp" alt="Industrial room with pipes and a door labeled Lockdown-Disabler" loading="lazy"></figure>
  </main>

  <section class="contact" id="contact">
    <h2>contact</h2>
    <div class="links">
      <button type="button" data-copy="benni6000" id="c-discord">benni6000 <small>discord · copy</small></button>
      <button type="button" data-copy="mutigerlo2@gmail.com" id="c-email">mutigerlo2@gmail.com <small>email · copy</small></button>
      <a href="https://www.roblox.com/users/8344050884/profile" target="_blank" rel="noopener">roblox profile <small>open ↗</small></a>
    </div>
  </section>

  <footer><span>© 2026 mutigerlo2</span><a href="#top" onclick="scrollTo({top:0});return false">back to top ↑</a></footer>
</div>

<div class="lb" id="lb"><img id="lb-img" alt=""></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="cur ring" aria-hidden="true"></div>
<div class="cur dot" aria-hidden="true"></div>

<script>
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

// typewriter: name types out letter by letter, like Minecraft chat
if(!calm){
  const t=document.getElementById('typed'),full=t.textContent;let i=0;t.textContent='';
  setTimeout(function step(){t.textContent=full.slice(0,++i);if(i<full.length)setTimeout(step,70+Math.random()*60)},350);
}

// copy
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
  const s=b.querySelector('small'),old=s.textContent;
  const ok=()=>{s.textContent='copied';setTimeout(()=>s.textContent=old,1400)};
  try{navigator.clipboard.writeText(b.dataset.copy).then(ok,()=>{s.textContent=b.dataset.copy})}catch(e){s.textContent=b.dataset.copy}
}));

// lightbox
const lb=document.getElementById('lb'),lbImg=document.getElementById('lb-img');
document.querySelectorAll('.shot').forEach(f=>f.addEventListener('click',()=>{const i=f.querySelector('img');lbImg.src=i.src;lbImg.alt=i.alt;lb.classList.add('open')}));
lb.addEventListener('click',()=>lb.classList.remove('open'));
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});

// reveal only things that start below the fold
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('below');io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>{if(el.getBoundingClientRect().top>innerHeight){el.classList.add('below');io.observe(el)}});

// cursor
if(matchMedia('(pointer:fine)').matches){
  document.documentElement.classList.add('has-cur');
  const dot=document.querySelector('.cur.dot'),ring=document.querySelector('.cur.ring');
  let mx=-100,my=-100,rx=-100,ry=-100;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.classList.add('on');ring.classList.add('on');
    dot.style.transform=`translate(${mx}px,${my}px)`;ring.classList.toggle('big',!!e.target.closest('a,button,.shot'))});
  document.addEventListener('mouseleave',()=>{dot.classList.remove('on');ring.classList.remove('on')});
  (function loop(){const k=calm?1:.16;rx+=(mx-rx)*k;ry+=(my-ry)*k;ring.style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(loop)})();
}

// particles: dust and embers drifting up, pushed away by the mouse
if(!calm){
  const c=document.getElementById('fx'),g=c.getContext('2d');let W,H,dpr;
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr};
  size();addEventListener('resize',size);
  let px=-1e4,py=-1e4;addEventListener('mousemove',e=>{px=e.clientX*dpr;py=e.clientY*dpr});
  const N=innerWidth<600?35:80;
  const mk=y=>({x:Math.random()*W,y:y??Math.random()*H,r:(Math.random()*1.6+.4)*dpr,vx:(Math.random()-.5)*.2*dpr,vy:-(Math.random()*.4+.1)*dpr,
    ember:Math.random()<.3,a:Math.random()*.5+.2,t:Math.random()*6.28,dx:0,dy:0});
  const ps=Array.from({length:N},()=>mk());
  (function draw(){
    g.clearRect(0,0,W,H);
    for(const p of ps){
      p.t+=.01;
      const ddx=p.x-px,ddy=p.y-py,d=Math.sqrt(ddx*ddx+ddy*ddy)+1,R=130*dpr;
      if(d<R){const f=(1-d/R)*1.3;p.dx+=ddx/d*f;p.dy+=ddy/d*f}
      p.dx*=.92;p.dy*=.92;
      p.x+=p.vx+Math.sin(p.t)*.3*dpr+p.dx;p.y+=p.vy+p.dy;
      if(p.y<-10||p.x<-10||p.x>W+10)Object.assign(p,mk(H+10));
      // square "pixel" particles
      const s=Math.round(p.r*2);
      if(p.ember){g.shadowBlur=8*dpr;g.shadowColor='rgba(240,60,40,.9)';g.fillStyle=`rgba(240,75,55,${p.a*(.6+Math.sin(p.t*5)*.4)})`}
      else{g.shadowBlur=0;g.fillStyle=`rgba(236,226,214,${p.a*.5})`}
      g.fillRect(Math.round(p.x),Math.round(p.y),s,s);
    }
    requestAnimationFrame(draw);
  })();
}
</script>

</body>
</html>
